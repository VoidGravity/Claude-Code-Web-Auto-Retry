name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release
        run: |
          node tests/parser.test.cjs
          node --check shared.js
          node --check content.js
          node --check background.js
          node --check popup.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest: PASS')"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build extension ZIP
        shell: bash
        run: |
          ZIP="claude-code-web-auto-retry-v${{ steps.version.outputs.version }}.zip"
          zip -9 "$ZIP" \
            manifest.json \
            background.js \
            content.js \
            shared.js \
            popup.html \
            popup.js \
            README.md \
            CHANGELOG.md \
            SECURITY.md \
            LICENSE

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ZIP="claude-code-web-auto-retry-v${{ steps.version.outputs.version }}.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing asset only."
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "Claude Code Web Auto-Retry $TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
